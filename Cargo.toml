[workspace]
members = ["crates/bucketlang", "crates/bkt"]
resolver = "2"

# `bucketlang` is the language: lexing, parsing, typing, evaluation, and the
# grammar-aware operations an edit needs (splice by span, run a bucket's tests,
# the atomicity oracle). `bkt` is the CLI over it, and holds nothing but
# argument parsing and output formatting.
#
# The split is so the library can be used without the CLI's opinions about how
# to print things.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bucketlang = { path = "crates/bucketlang" }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
ureq = { version = "3.3.0", features = ["json"] }
