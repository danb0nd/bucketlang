[workspace]
members = ["crates/bucketlang", "crates/bkt"]
resolver = "2"

# The split exists so the language and the agent harness can move at different
# speeds. `bucketlang` is the language: lexing, parsing, typing, evaluation, and
# the grammar-aware operations an edit needs (splice by span, run a bucket's
# tests). `bucket-harness` is the experiment on top: what context to retrieve,
# how to encode it, when to retry, and what any of it costs in tokens.
#
# Keeping them as separate crates makes the boundary real — the harness can only
# reach what the language exports — without paying the coordination cost of two
# repositories.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bucketlang = { path = "crates/bucketlang" }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
ureq = { version = "3.3.0", features = ["json"] }
